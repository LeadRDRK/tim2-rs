[package]
name = "tim2-rs"
version = "0.3.0"
edition = "2024"
description = "TIM2 image decoding and encoding library"
license = "MIT"
repository = "https://github.com/LeadRDRK/tim2-rs"
categories = ["multimedia::images"]
keywords = ["ps2", "texture", "decoder", "encoder", "codec"]

[lib]
name = "tim2"

[dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
bitflags = "2.13"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde", "bitflags/serde"]

[workspace]
resolver = "3"
members = ["tim2view"]