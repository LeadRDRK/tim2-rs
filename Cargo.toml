[package]
name = "tim2-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "tim2"

[dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
bitflags = "2.13"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde", "bitflags/serde"]